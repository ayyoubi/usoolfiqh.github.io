<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usul elfiqh - Interactive Flipbook</title>
    
    <!-- Open Graph Meta Tags for Discord Link Previews -->
    <meta property="og:title" content="Usul elfiqh - Interactive Flipbook">
    <meta property="og:description" content="Click to read and flip through the pages directly in your browser.">
    <meta property="og:url" content="https://ayyoubi.github.io/Flipbook/">
    <meta property="og:image" content="https://ayyoubi.github.io/Flipbook/cover.jpg">

    <!-- Load older, stable PDF.js and PageFlip library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        body { margin: 0; background: #2f3136; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; font-family: Arial, sans-serif; color: white; }
        #book { width: 90vw; height: 90vh; box-shadow: 0 0 20px rgba(0,0,0,0.5); display: none; }
        #loading { font-size: 1.2rem; text-align: center; padding: 20px; }
        .page { background-color: white; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .page canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body>
    <div id="loading">Preparing your flipbook...</div>
    <div id="book"></div>

    <script>
        // Disable external worker so it runs directly on the main thread (bypassing sandbox blocks)
        pdfjsLib.GlobalWorkerOptions.workerSrc = '';

        const url = 'https://ayyoubi.github.io/Flipbook/usul_elfiqh.pdf';
        const loadingDiv = document.getElementById('loading');
        const bookContainer = document.getElementById('book');

        pdfjsLib.getDocument(url).promise.then(async pdf => {
            let pageDivs = [];
            
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                loadingDiv.innerText = `Loading page ${pageNum} of ${pdf.numPages}...`;
                const page = await pdf.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.4 });

                const canvas = document.createElement('canvas');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                const context = canvas.getContext('2d');

                await page.render({ canvasContext: context, viewport: viewport }).promise;

                const div = document.createElement('div');
                div.className = 'page';
                div.appendChild(canvas);
                pageDivs.push(div);
            }

            loadingDiv.style.display = 'none';
            bookContainer.style.display = 'block';

            // Initialize the page-flip effect
            const pageFlip = new St.PageFlip(bookContainer, {
                width: 550,
                height: 733,
                size: "stretch",
                minWidth: 315,
                maxWidth: 1000,
                minHeight: 420,
                maxHeight: 1350,
                maxShadowOpacity: 0.5,
                showCover: true,
                mobileScrollSupport: false
            });

            pageFlip.loadFromHTML(pageDivs);

        }).catch(err => {
            loadingDiv.style.color = '#ff6b6b';
            loadingDiv.innerText = "Error loading book: " + err.message;
            console.error(err);
        });
    </script>
</body>
</html>
